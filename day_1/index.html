<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Journey — Day 1</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="app">
  <header class="hero">
    <div>
      <div class="eyebrow">🇬🇧 ENGLISH JOURNEY</div>
      <h1>Day 1 — B1 Vocabulary</h1>
      <p>20 useful B1 words. Learn, practise, and check your score.</p>
    </div>
    <div class="badge">30–60 min</div>
  </header>

  <section class="progress-wrap">
    <div class="progress-label"><span>Your progress</span><strong id="progressText">0%</strong></div>
    <div class="progress"><div id="progressBar"></div></div>
  </section>

  <section class="card">
    <div class="section-head"><span class="step">STEP 1</span><h2>Learn the words</h2></div>
    <div id="wordCard" class="word-card"></div>
    <div class="controls">
      <button id="prevBtn" class="secondary">← Previous</button>
      <button id="nextBtn">Next →</button>
    </div>
  </section>

  <section class="card quiz-card">
    <div class="section-head"><span class="step">STEP 2</span><h2>Quick quiz</h2></div>
    <div id="quiz"></div>
    <button id="submitBtn" class="full">Check answers</button>
    <div id="result" class="result" hidden></div>
  </section>

  <footer><a href="../">← Back to English Journey</a></footer>
</main>
<script src="./script.js"></script>
</body>
</html>
